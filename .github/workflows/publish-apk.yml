name: Publish APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "رقم تشغيل Android test APK"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: byraslan-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv app-release.apk byraslan-test.apk
          gh release create "apk-${{ inputs.run_id }}" byraslan-test.apk -R ${{ github.repository }} --title "باي رسلان — نسخة تجربة أندرويد" --notes "نسخة تجربة (وضع التجربة شغال)" --prerelease
