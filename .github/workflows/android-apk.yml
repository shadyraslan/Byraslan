name: Android test APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: "التطبيق (mobile = العملاء، staff-app = الموظفين)"
        default: mobile

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.app || 'mobile' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx expo install --fix
      # الإشعارات: لو EXPO_TOKEN متحط في أسرار GitHub بيربط التطبيق بمشروع Expo (projectId)،
      # ولو GOOGLE_SERVICES_JSON (ملف Firebase) متحط بيتضاف عشان إشعارات الأندرويد
      - name: Link Expo project (push)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npx -y eas-cli@latest init --non-interactive --force
      - name: Firebase file (push)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GSJ != '' }}
        run: |
          printf '%s' "$GSJ" > google-services.json
          node -e "const f='app.json';const a=require('./'+f);a.expo.android.googleServicesFile='./google-services.json';require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: ${{ inputs.app || 'mobile' }}/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: byraslan-apk
          path: ${{ inputs.app || 'mobile' }}/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=${{ inputs.app == 'staff-app' && 'byraslan-staff' || 'byraslan-test' }}
          cp android/app/build/outputs/apk/release/app-release.apk $N.apk
          gh release create "apk-${{ github.run_id }}" $N.apk -R ${{ github.repository }} --title "${{ inputs.app == 'staff-app' && 'باي رسلان الموظفين' || 'باي رسلان' }} — نسخة تجربة أندرويد" --notes "نسخة تجربة" --prerelease
