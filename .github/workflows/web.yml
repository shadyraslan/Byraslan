name: Web (ERP)

on:
  push:
    branches: [main]
    paths: ["src/**", "package.json", "next.config.ts", "tsconfig.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["src/**", "package.json", "next.config.ts", "tsconfig.json"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
